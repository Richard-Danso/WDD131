<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGear Hub | Contact Us</title>
    <meta name="description" content="Contact TechGear Hub for gear suggestions or assistance.">
    <meta name="author" content="Richard Danso">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="scripts/main.js" defer></script>
</head>
<body>
    <header>
        <h1>TechGear Hub</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Gear Catalog</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Get in Touch</h2>

        <form id="contact-form">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="subject">Topic:</label>
                <select id="subject" name="subject" required>
                    <option value="">Select a topic...</option>
                    <option value="Review Request">Review Request</option>
                    <option value="Setup Advice">Setup Advice</option>
                    <option value="General Question">General Question</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>

        <div id="form-feedback" style="margin-top: 1.5rem; text-align: center; font-weight: 600;"></div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> | TechGear Hub | <a href="references.html">References</a></p>
    </footer>
</body>
</html>
